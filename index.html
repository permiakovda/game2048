<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./styles/Normalize.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/main.css">

<body class="no-js">
    <header class="header visually-hidden">
        <h1>Игра 2048</h1>

        <p>
            Известная и популярная игра головоломка "2048". В этой игре необходимо правильно 
            комбинировать цифры собирая из двух похожих цифр одну более высокого номинала и 
            таким образом добраться до числа 2048
        </p>
    </header>

    <div class="no-js-infoblock">
        на данный момент JS отключен в вашем браузере
    </div>

    <div class="fixed-container">
        <main class="main">
            <canvas id="myCanvas" class="game-canvas" width="200" height="100"></canvas>
        </main>
    </div>
    
    

    <script defer src="./scripts/no-js.js"></script>
    <script defer src="./scripts/main.js"></script>
